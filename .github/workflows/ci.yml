name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Unit-test scripts
        run: bash scripts/affected-unit-test-args_test.sh
      - name: Affected unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t plan < <(scripts/affected-unit-test-args.sh "${BASE_SHA}" "${HEAD_SHA}")
          echo "unit test plan: ${plan[0]}"
          case "${plan[0]}" in
            RUN=none) echo "No unit-test inputs changed; skipping unit tests." ;;
            RUN=full) ./gradlew --no-daemon --build-cache testDebugUnitTest ;;
            RUN=filtered) ./gradlew --no-daemon --build-cache testDebugUnitTest "${plan[@]:1}" ;;
            *) echo "unknown plan: ${plan[0]}" >&2; exit 1 ;;
          esac
      - name: Debug build
        run: ./gradlew --no-daemon --build-cache assembleDebug

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - run: ./gradlew --no-daemon --build-cache lint
