name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Unit-test scripts
        run: bash scripts/affected-unit-test-args_test.sh
      - name: Affected unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t plan < <(scripts/affected-unit-test-args.sh "${BASE_SHA}" "${HEAD_SHA}")
          echo "unit test plan: ${plan[0]}"
          case "${plan[0]}" in
            RUN=none) echo "No unit-test inputs changed; skipping unit tests." ;;
            RUN=full) ./gradlew --no-daemon --build-cache testDebugUnitTest ;;
            RUN=filtered) ./gradlew --no-daemon --build-cache testDebugUnitTest "${plan[@]:1}" ;;
            *) echo "unknown plan: ${plan[0]}" >&2; exit 1 ;;
          esac
      - name: Debug build
        run: ./gradlew --no-daemon --build-cache assembleDebug

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: ./gradlew --no-daemon --build-cache lint
