name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Unit-test scripts
        run: bash scripts/affected-unit-test-args_test.sh
      - name: Affected unit tests
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t plan < <(scripts/affected-unit-test-args.sh "${BASE_SHA}" "${HEAD_SHA}")
          echo "unit test plan: ${plan[0]}"
          case "${plan[0]}" in
            RUN=none) echo "No unit-test inputs changed; skipping unit tests." ;;
            RUN=full) ./gradlew --no-daemon --build-cache testDebugUnitTest ;;
            RUN=filtered) ./gradlew --no-daemon --build-cache testDebugUnitTest "${plan[@]:1}" ;;
            *) echo "unknown plan: ${plan[0]}" >&2; exit 1 ;;
          esac

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - run: ./gradlew --no-daemon --build-cache lint

  release:
    needs: [unit-test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Decode the release keystore into the runner temp directory
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon --build-cache assembleRelease
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
      - name: Publish GitHub release with the APK
        run: |
          set -euo pipefail
          tag="v${APP_VERSION_NAME}"
          apk="time-tracking-radio-widget-${APP_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          gh release create "${tag}" "${apk}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
