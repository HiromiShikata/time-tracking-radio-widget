name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - run: ./gradlew --no-daemon --build-cache testDebugUnitTest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - run: ./gradlew --no-daemon --build-cache lint

  release:
    needs: [unit-test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Build signed release APK
        run: ./gradlew --no-daemon --build-cache assembleRelease
      - name: Publish GitHub release with the APK
        run: |
          set -euo pipefail
          tag="v${APP_VERSION_NAME}"
          apk="time-tracking-radio-widget-${APP_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          gh release create "${tag}" "${apk}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
